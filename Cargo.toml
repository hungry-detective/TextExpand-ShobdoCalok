[package]
name = "shobdo_calok"
version = "2.0.0"
edition = "2021"
description = "A fast, keyboard-friendly text expander for Windows"
license = "GPL-3.0-or-later"

[[bin]]
name = "ShobdoCalok"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
regex = "1"
arboard = "3"
resvg = "0.45"
ureq = { version = "3", features = ["json"] }
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
rand = "0.8"
urlencoding = "2"
rfd = "0.15"
parking_lot = "0.12"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_System_Power",
    "Win32_System_RemoteDesktop",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
] }
raw-window-handle = "0.6"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"
