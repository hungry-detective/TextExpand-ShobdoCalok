name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Write Google OAuth credentials (embedded into the exe)
        env:
          GOOGLE_CLIENT_SECRET_JSON: ${{ secrets.GOOGLE_CLIENT_SECRET_JSON }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GOOGLE_CLIENT_SECRET_JSON)) { throw "GOOGLE_CLIENT_SECRET_JSON secret is not set - Google login would not work" }
          $null = $env:GOOGLE_CLIENT_SECRET_JSON | ConvertFrom-Json
          Set-Content -Path client_secret.json -Value $env:GOOGLE_CLIENT_SECRET_JSON -Encoding utf8NoBOM -NoNewline
          Write-Host "client_secret.json written"

      - name: Build
        run: cargo build --release --locked

      - name: Package
        shell: pwsh
        run: |
          $v = "$env:GITHUB_REF_NAME" -replace '^v',''
          New-Item -ItemType Directory -Force dist/ShobdoCalok | Out-Null
          Copy-Item target/release/ShobdoCalok.exe dist/ShobdoCalok/
          Copy-Item LICENSE, README.md dist/ShobdoCalok/
          Copy-Item target/release/ShobdoCalok.exe dist/ShobdoCalok.exe
          Compress-Archive -Path dist/ShobdoCalok -DestinationPath "dist/ShobdoCalok-v$v-portable.zip" -Force
          $zip = "ShobdoCalok-v$v-portable.zip"
          $h = (Get-FileHash "dist/$zip" -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path "dist/ShobdoCalok-v$v-portable.sha256" -Value "$h  $zip" -NoNewline
          Get-ChildItem dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ShobdoCalok-v*-portable.zip
            dist/ShobdoCalok-v*-portable.sha256
            dist/ShobdoCalok.exe
          generate_release_notes: true
