name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build portable app
        working-directory: textqml
        run: pyinstaller --noconfirm --clean ShobdoCalok.spec

      - name: Sanity check build
        working-directory: textqml/dist/ShobdoCalok
        run: |
          if (-not (Test-Path "ShobdoCalok.exe")) { throw "ShobdoCalok.exe missing" }
          if (-not (Test-Path "_internal")) { throw "_internal missing" }

      - name: Zip portable build
        working-directory: textqml/dist
        run: Compress-Archive -Path "ShobdoCalok" -DestinationPath "ShobdoCalok-portable.zip" -Force

      - name: Determine version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $env:GITHUB_OUTPUT

      - name: Rename zip with version
        working-directory: textqml/dist
        run: |
          $v = "${{ steps.version.outputs.version }}"
          Rename-Item "ShobdoCalok-portable.zip" "ShobdoCalok-v${v}-portable.zip"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: textqml/dist/ShobdoCalok-v*-portable.zip
          generate_release_notes: true
